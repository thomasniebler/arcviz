[project]
name = "arcviz-agent"
version = "0.5.0"
description = "Chat-driven manipulation of a UML-like deployment model with live Mermaid rendering"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

# Everything that only some deployments use is an extra, imported lazily with a clear error (ADR-0107). The Docker
# image installs every runtime extra (ADR-0108); keep its ARCVIZ_EXTRAS in step when adding one.
[project.optional-dependencies]
anthropic = ["anthropic>=0.50"]
openai = ["openai>=1.106"]  # 1.106: a callable api_key (the Entra token, ADR-0115)
azure-openai = ["openai>=1.106", "azure-identity>=1.17"]
cosmos = ["azure-cosmos>=4.9", "azure-identity>=1.17"]
# ARCVIZ_TELEMETRY=otlp|azure-monitor (ADR-0114): the Azure Monitor distro brings the OpenTelemetry SDK and the FastAPI
# instrumentation; the OTLP exporter adds the vendor-neutral path.
telemetry = ["azure-monitor-opentelemetry>=1.6", "opentelemetry-exporter-otlp-proto-http>=1.27"]
# ARCVIZ_MCP=1 (ADR-0170): the official MCP SDK serves the protocol; PyJWT with cryptography validates OIDC access tokens
# (ARCVIZ_MCP_OAUTH_ISSUER, ADR-0173).
mcp = ["mcp>=2.3,<3", "pyjwt[crypto]>=2.8"]
# GET /api/projects/{id}/arc42.docx (ADR-0207): the Word writer; 501 naming this extra without it.
docx = ["python-docx>=1.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
    "arcviz-agent[anthropic,openai,azure-openai,cosmos,telemetry,mcp,docx]",
]

[project.scripts]
arcviz = "arcviz.server:main"
arcviz-migrate = "arcviz.cli:migrate_main"

# The docs toolchain is a PEP 735 dependency group (not package metadata), pinned by uv.lock (ADR-0109). The site is
# built into the package (arcviz/docs_site, ADR-0116); `make install` installs the group.
[dependency-groups]
docs = ["zensical>=0.0.60"]

[build-system]
requires = ["hatchling==1.32.4"]  # exact, so every build backend run is the same (ADR-0109)
build-backend = "hatchling.build"

[tool.hatch.build]
# The documentation site is git-ignored (a build output) but ships in every sdist and wheel: build it first with
# `make docs-bundle` (scripts/build_docs_bundle.py); hatch_build.py refuses a non-editable build without it (ADR-0116).
artifacts = ["arcviz/docs_site/"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["arcviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_ids: new diagram and project ids with their random suffix (ADR-0131), not tests/conftest.py's readable ones"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E702", "SIM117"]

[tool.mypy]
python_version = "3.11"
packages = ["arcviz"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
