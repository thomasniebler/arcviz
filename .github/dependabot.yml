# Dependency updates (owner's decision in M9, ADR-0109/0110): monthly, one grouped pull request per ecosystem, so
# about 1-3 pull requests and CI runs a month (CLAUDE.md "CI minutes"). Security updates stay ungrouped (GitHub's
# default) and arrive when an advisory is published. Commit prefixes keep the PR titles Conventional ("PR title").
version: 2
updates:
  # uv.lock (Python dependencies of every extra and the docs group)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # The Dockerfile's base images, pinned by version and digest. A new uv image also needs the same version in
  # .github/actions/setup/action.yml and release-please.yml (tests/test_reproducible_builds.py fails until then).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # GitHub Actions, pinned by commit SHA with the version as a comment
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/setup"]  # the workflows and the composite setup action
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
