name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Release PR / GitHub release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A PAT or GitHub App token is needed if CI should run on the release PR itself
          # (workflows are not triggered by events created with GITHUB_TOKEN). Falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: Publish container image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-wheel:
    name: Attach wheel to release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
      # The documentation site the app serves under /docs ships in the wheel (ADR-0042).
      - name: Build the documentation site into arcviz/docs_site
        run: |
          uv sync --locked --only-group docs --no-install-project
          .venv/bin/python scripts/build_docs_bundle.py
      - run: uv build # the build hook refuses a wheel or sdist without arcviz/docs_site (ADR-0116)
      - run: python3 scripts/check_wheel_docs.py dist/*.whl
      # The tested dependency set with hashes, for installing the wheel reproducibly (ADR-0109):
      #   pip install --require-hashes -r arcviz-agent-<v>-requirements.txt && pip install --no-deps <wheel>
      - name: Export the locked runtime dependencies
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          uv export --frozen --no-emit-project --no-default-groups --format requirements.txt \
            --extra anthropic --extra openai --extra azure-openai --extra cosmos --extra telemetry \
            -o "dist/arcviz-agent-$VERSION-requirements.txt"
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
